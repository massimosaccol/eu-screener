name: Aggiornamento screener

on:
  schedule:
    - cron: "0 18 * * 1-5"   # 18:00 UTC, giorni feriali (dopo la chiusura europea)
  workflow_dispatch:
    inputs:
      period:
        description: "Storico prezzi"
        default: "3y"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui la pipeline
        run: python -m src.pipeline --period "${{ inputs.period || '3y' }}"

      - name: Commit dei risultati
        run: |
          git config user.name  "screener-bot"
          git config user.email "actions@github.com"
          git add data/*.parquet data/*.csv data/*.json
          if git diff --staged --quiet; then
            echo "Nessuna variazione."
            exit 0
          fi
          git commit -m "Aggiornamento dati $(date -u +'%Y-%m-%d')"
          # Nel frattempo qualcun altro potrebbe aver scritto sul repository:
          # si integra il remoto tenendo i dati appena generati, poi si riprova.
          for i in 1 2 3; do
            if git push; then
              echo "Push riuscito al tentativo $i."
              exit 0
            fi
            echo "Push respinto, sincronizzo con il remoto (tentativo $i)."
            git pull --no-rebase -X ours --no-edit origin main || exit 1
            sleep 5
          done
          echo "Push fallito dopo 3 tentativi."
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screener-data
          path: data/*.csv
          retention-days: 30
